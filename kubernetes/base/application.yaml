apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-status
  namespace: ops-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-status-v1
  namespace: ops-lab
immutable: true
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 128;
    }

    http {
      access_log /dev/stdout;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8080;
        default_type application/json;

        location = / {
          return 200 '{"service":"inventory-status","version":"v1","data":"synthetic"}\n';
        }

        location = /version {
          return 200 '{"version":"v1"}\n';
        }

        location = /catalog {
          return 200 '{"items":[{"sku":"LAB-001","quantity":12}]}\n';
        }

        location = /livez {
          return 200 'ok\n';
        }

        location = /readyz {
          return 200 'ready\n';
        }

        location / {
          return 404 '{"error":"not-found"}\n';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-status
  namespace: ops-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 180

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: inventory-status

  template:
    metadata:
      labels:
        app: inventory-status
        compute: lab

    spec:
      serviceAccountName: inventory-status
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inventory-status

      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx-unprivileged@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          args: ["-g", "daemon off;"]

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: inventory-status-v1
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-status
  namespace: ops-lab
spec:
  type: ClusterIP
  selector:
    app: inventory-status
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-status
  namespace: ops-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inventory-status
