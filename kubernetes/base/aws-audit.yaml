apiVersion: v1
kind: Pod
metadata:
  name: aws-audit
  namespace: ops-lab
  labels:
    app: aws-audit
    compute: lab
spec:
  serviceAccountName: aws-audit
  automountServiceAccountToken: false
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: aws-cli
      image: public.ecr.aws/aws-cli/aws-cli:2.35.14
      command: ["/bin/sh", "-c"]
      args: ["sleep 1800"]
      workingDir: /tmp

      env:
        - name: HOME
          value: /tmp
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        - name: AWS_PAGER
          value: ""

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      volumeMounts:
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 32Mi
