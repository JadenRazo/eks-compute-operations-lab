apiVersion: v1
kind: Pod
metadata:
  name: service-observer
  namespace: ops-lab
  labels:
    app: service-observer
    compute: lab
spec:
  serviceAccountName: inventory-status
  automountServiceAccountToken: false
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: observer
      image: public.ecr.aws/nginx/nginx-unprivileged@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
      command: ["/bin/sh", "-c"]
      args:
        - |
          i=0
          while [ "$i" -lt 1800 ]; do
            stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            if wget -q -T 2 -O /dev/null \
              http://inventory-status.ops-lab.svc.cluster.local/readyz; then
              echo "$stamp OK"
            else
              echo "$stamp FAIL"
            fi

            i=$((i + 1))
            sleep 1
          done

      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
